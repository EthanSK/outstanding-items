# Codex packaging metadata. Claude Code safely ignores this file.
# Implicit invocation loads the skill so the user's ledger stays visible. It
# never authorizes the agent to work on an item in that ledger.
interface:
  display_name: "Outstanding Items"
  short_description: "Hold the user's outstanding-items ledger"
  default_prompt: "Use $outstanding-items to keep my requests and every concrete user-facing loose end recorded and honestly labelled, store each Git-project chat in its own Git-ignored project ledger by default, reconcile exact completion evidence into Done, intelligently order automatic items without overwriting manual placement, check for omitted loose ends before calling the ledger empty, end each final response with one compact line naming a single suggested next item rather than the whole list, and never start, continue, or hand off an item without a fresh instruction from me naming it."
policy:
  allow_implicit_invocation: true
